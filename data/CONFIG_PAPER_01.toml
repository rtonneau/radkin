# ==================================================================================
# CONFIG_PAPER_01.toml: the configuration of the original runs of
# Tonneau et al. 2025 (Phys. Med. Biol. 70 235021).
#
# Copied verbatim (below this header) from the author's original simulation
# folder, CONFIG/CONFIG_PAPER_01.toml, included by pH/CONFIG3.toml of the runs
# that produced the values quoted in the paper's text (sim_GVal_Dr_pH3.h5,
# 2025-02-28; LET 0.56 keV/um, GF(DR) fit shipped by radiopyo). Used by the
# "original" scenario of paper_runs.py. CONFIG3.toml also set
# variable_GValues = true (set in code by paper_runs) and the legacy
# force_positive = false flag (gone from radiopyo, the current default).
#
# Rate constants that differ from radiopyo/data/advanced_water_radiolysis.toml:
#   e_aq + O2 -> O2_minus             2.29e10 (bundled 1.9e10)
#   H_r + O2 -> HO2                   4.2e10  (bundled 1.31e10)
#   H_r + HO2 -> H2O2                 1.8e10  (bundled 1.14e10)
#   O2_minus + O_minus -> 2 OH_minus + O2    written without H2O
# ==================================================================================

[parameters]
pH = 7
force_cst_pH = false

[concentrations.initial]
O2 = 52e-6

# ----------------------------------------------------------------------------------
#                             DEFINE RADIOLYTIC REACTIONS                            
# ----------------------------------------------------------------------------------
[reactions.radiolytic] # Unit is [radical / 100eV / incident particle]
e_aq = 2.6     # 2.8
OH_r = 2.7     # 2.8
H_r = 0.6      # 0.62
H2 = 0.45      # 0.47
H2O2 = 0.7     # 0.73
H3O_plus = 2.6 # 2.8 #3.24


# ----------------------------------------------------------------------------------
#                                    DEFINE REACTIONS                            
# ----------------------------------------------------------------------------------
######################################## Acid-Base Reactions
[[reactions.acid_base]]
reaction = "H2O2 <-> H3O_plus + HO2_minus"
pKa = 11.65
k_forward = 9.43e-2
k_backward = 5.02e10

[[reactions.acid_base]]
reaction = "OH_r <-> O_minus + H3O_plus"
pKa = 11.9
k_forward = 9.43e-2
k_backward = 5.02e10

[[reactions.acid_base]]
reaction = "HO2 <-> O2_minus + H3O_plus"
pKa = 4.57
k_forward = 7.73e5
k_backward = 5.02e10

[[reactions.equilibrium]]
reaction = "HO2 + OH_minus <-> O2_minus + H2O"
k_forward = 1.33e10
k_backward = 1.55e-1


[[reactions.equilibrium]]
reaction = "H2O <-> H3O_plus + OH_minus"
pKa = 13.999
k_forward = 2.12e-5
k_backward = 1.18e11

[[reactions.equilibrium]]
reaction = "H2O2 + OH_minus <-> HO2_minus + H2O"
k_forward = 1.33e10
k_backward = 1.27e6

[[reactions.equilibrium]]
reaction = "e_aq + H2O <-> H_r + OH_minus"
k_forward = 15.75
k_backward = 2.44e7

[[reactions.equilibrium]]
reaction = "H_r <-> e_aq + H3O_plus"
k_forward = 5.83
k_backward = 2.09e10

[[reactions.equilibrium]]
reaction = "OH_r + OH_minus <-> O_minus + H2O"
k_forward = 1.33e10
k_backward = 1.27e6


